# Мини-апп ToDoBOT: статика фронта + API в процессе бота (127.0.0.1:8081).
# Лежит в /etc/nginx/sites-available/todo, симлинк в sites-enabled.
# Сертификат на поддомен свой: certbot certonly --webroot -w /var/www/html
# -d todo.alxforbot.online (проверочный файл отдаёт блок на 80 ниже).

# API отвечает одному человеку: 5 запросов в секунду с запасом хватает
# мини-аппу и мешают перебирать ключи задач с перехваченной подписью.
limit_req_zone $binary_remote_addr zone=todo_api:1m rate=5r/s;

# CSP одна на все ответы. Скрипты — только свои и SDK Telegram: заголовки
# задач приходят из чужих пересланных сообщений, и случайный XSS не должен
# суметь унести initData. Inline-стили разрешены для SDK Telegram.
map $host $todo_csp {
    default "default-src 'self'; script-src 'self' https://telegram.org; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors https://web.telegram.org https://*.telegram.org";
}

server {
    listen 80;
    listen [::]:80;
    server_name todo.alxforbot.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24: `http2 on` появилась только в 1.25.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name todo.alxforbot.online;

    ssl_certificate /etc/letsencrypt/live/todo.alxforbot.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.alxforbot.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # X-Frame-Options нет намеренно: Telegram Web открывает мини-апп в
    # iframe. Кто может встраивать — ограничиваем через frame-ancestors.
    # add_header внутри location отменяет заголовки server, поэтому в
    # каждом location со своим add_header набор повторяется целиком.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy $todo_csp always;

    root /var/www/todobot;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем: он ссылается на бандл с хэшем, старые бандлы
    # при выкладке удаляются — закэшированный HTML откроет пустой экран.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy $todo_csp always;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy $todo_csp always;
    }

    location /api/ {
        limit_req zone=todo_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }
}
